<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酒店与民宿收藏 - 夏威夷旅行</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="fixed inset-0 -z-10">
    <div class="absolute top-0 left-1/2 h-96 w-96 -translate-x-1/2 rounded-full bg-sky-500/20 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 h-96 w-96 rounded-full bg-orange-500/10 blur-3xl"></div>
  </div>

  <header class="border-b border-white/10 bg-slate-950/70 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
      <a href="index.html" class="text-lg font-bold">Oneald Family OS</a>
      <nav class="hidden gap-6 text-sm text-slate-300 md:flex">
        <a href="index.html" class="hover:text-white">首页</a>
        <a href="apps.html" class="hover:text-white">应用</a>
        <a href="hawaii.html" class="text-white">夏威夷</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-12">
    <a href="hawaii.html" class="mb-8 inline-flex text-sm text-sky-300 hover:text-white">
      ← 返回夏威夷旅行
    </a>

    <section class="rounded-3xl border border-white/10 bg-white/5 p-8">
      <div class="mb-4 inline-flex rounded-full border border-orange-400/30 bg-orange-400/10 px-4 py-1 text-sm text-orange-200">
        Hawaii Travel · Hotels
      </div>

      <h1 class="text-4xl font-bold md:text-6xl">
        酒店与民宿收藏
      </h1>

      <p class="mt-5 max-w-3xl text-lg leading-8 text-slate-300">
        用于收藏夏威夷旅行中可能入住的酒店、民宿、公寓和家庭友好型住宿。
      </p>
    </section>

    <section class="mt-10 grid gap-6 md:grid-cols-3">
      <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
        <h2 class="text-xl font-bold text-sky-200">海滩度假酒店</h2>
        <p class="mt-3 leading-7 text-slate-300">
          适合亲子度假，优先考虑步行到海滩、泳池、安全性和儿童设施。
        </p>
      </div>

      <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
        <h2 class="text-xl font-bold text-orange-200">家庭公寓</h2>
        <p class="mt-3 leading-7 text-slate-300">
          适合长住和多人出行，重点比较厨房、洗衣机、停车和空间。
        </p>
      </div>

      <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
        <h2 class="text-xl font-bold text-cyan-200">预算住宿</h2>
        <p class="mt-3 leading-7 text-slate-300">
          用于记录性价比高的住宿选择，方便控制整体旅行预算。
        </p>
      </div>
    </section>
  </main>

  <footer class="border-t border-white/10 px-6 py-8 text-center text-sm text-slate-500">
    Oneald Family OS · Hawaii Hotels
  </footer>
</body>
</html>
